name: Desktop Build (Windows & Linux)

on:
  push:
    branches: ["**"]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  pull_request:
    paths:
      - "desktop/**"
      - ".github/workflows/desktop-build.yml"
  workflow_dispatch:

jobs:
  build-desktop:
    name: Build Convo Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: desktop

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.50.1"
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgtk-3-dev pkg-config clang cmake

      - name: Install Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          echo "Visual Studio toolchain is preinstalled on windows-latest runners."

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze --no-fatal-infos

      - name: Unit tests
        run: flutter test

      - name: Build Linux release
        if: runner.os == 'Linux'
        run: flutter build linux --release

      - name: Build Windows release
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Package Linux bundle (tar.gz)
        if: runner.os == 'Linux'
        working-directory: .
        run: |
          set -e
          STAGING=convo-desktop-linux-x64
          rm -rf "$STAGING"
          mkdir -p "$STAGING/bin"
          cp -r desktop/build/linux/x64/release/bundle/* "$STAGING/bin/"
          mkdir -p "$STAGING/icons"
          cp desktop/assets/convo_icon.png "$STAGING/icons/convo_chat.png"
          cat > "$STAGING/ConvoChat.desktop" <<'EOF'
          [Desktop Entry]
          Type=Application
          Name=Convo Chat
          GenericName=Chat
          Comment=Convo Chat desktop client (Windows & Linux port)
          Exec=convo_chat
          Icon=convo_chat
          Terminal=false
          Categories=Network;InstantMessaging;
          StartupWMClass=convo_chat
          EOF
          cat > "$STAGING/INSTALL.md" <<'EOF'
          # Convo Chat — Linux install
          sudo cp bin/convo_chat /usr/local/bin/convo_chat
          sudo mkdir -p /usr/share/icons/hicolor/512x512/apps
          sudo cp icons/convo_chat.png /usr/share/icons/hicolor/512x512/apps/convo_chat.png
          sudo cp ConvoChat.desktop /usr/share/applications/ConvoChat.desktop
          EOF
          tar -czf convo-desktop-linux-x64.tar.gz "$STAGING"

      - name: Package Windows bundle (zip)
        if: runner.os == 'Windows'
        working-directory: .
        shell: pwsh
        run: |
          $staging = "convo-desktop-windows-x64"
          if (Test-Path $staging) { Remove-Item -Recurse -Force $staging }
          New-Item -ItemType Directory -Path "$staging/bin" -Force | Out-Null
          Copy-Item -Recurse -Force "desktop/build/windows/x64/runner/Release/*" "$staging/bin/"
          Copy-Item "desktop/assets/convo_icon.png" "$staging/convo_icon.png"
          @'
          # Convo Chat — Windows install
          1. Unzip this archive.
          2. Run bin\convo_chat.exe (requires the Microsoft Visual C++ redistributable).
          3. Optionally pin to Start: right click convo_chat.exe > Pin to Start.
          '@ | Out-File -Encoding utf8 "$staging/INSTALL.md"
          Compress-Archive -Force -Path "$staging" -DestinationPath "convo-desktop-windows-x64.zip"

      - name: Upload Linux artifact
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: convo-desktop-linux-x64
          path: convo-desktop-linux-x64.tar.gz
          if-no-files-found: error

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: convo-desktop-windows-x64
          path: convo-desktop-windows-x64.zip
          if-no-files-found: error
